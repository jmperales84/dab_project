resources:
  jobs:
    citibike_etl_pipeline_py:
      name: citibike_etl_pipeline_py

      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl

      tasks:
        #- task_key: 00_wheel_upload  <- Esta tarea sería necesaria definida si el cluster fuera dedicado
        #    job_cluster_key: default
        #    python_wheel_task:
        #      package_name: dab_project
        #      entry_point: main  # <--- Debe coincidir con la clave definida en console_scripts
        #    libraries:
        #      - whl: ../dist/*.whl  # <--- Aquí va la referencia a la rueda

        - task_key: 01_bronze_citibike
          environment_key: default
          spark_python_task:
            python_file: ../citibike_etl/scripts/01_bronze/01_bronze_citibike.py
            parameters:
              - "--pipeline_id"
              - "{{job.id}}"
              - "--run_id"
              - "{{job.run_id}}"
              - "--task_id"
              - "{{task.run_id}}"
              - "--processed_timestamp"
              - "{{job.start_time.iso_datetime}}"
              - "--catalog"
              - "${var.catalog}"
              - "--bronze_schema"
              - "${var.bronze_schema}"

        - task_key: 02_silver_citibike
          depends_on:
            - task_key: 01_bronze_citibike

          environment_key: default
          spark_python_task:
            python_file: ../citibike_etl/scripts/02_silver/02_silver_citibike.py
            parameters:
              - "--pipeline_id"
              - "{{job.id}}"
              - "--run_id"
              - "{{job.run_id}}"
              - "--task_id"
              - "{{task.run_id}}"
              - "--processed_timestamp"
              - "{{job.start_time.iso_datetime}}"
              - "--catalog"
              - "${var.catalog}"
              - "--bronze_schema"
              - "${var.bronze_schema}"
              - "--silver_schema"
              - "${var.silver_schema}"

        - task_key: 03_gold_citibike_daily_ride_summary
          depends_on:
            - task_key: 02_silver_citibike
          environment_key: default
          spark_python_task:
            python_file: ../citibike_etl/scripts/03_gold/03_gold_citibike_daily_ride_summary.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--silver_schema"
              - "${var.silver_schema}"
              - "--gold_schema"
              - "${var.gold_schema}"

        - task_key: 03_gold_citibike_daily_station_performance
          depends_on:
            - task_key: 02_silver_citibike
          environment_key: default
          spark_python_task:
            python_file: ../citibike_etl/scripts/03_gold/03_gold_citibike_daily_station_performance.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--silver_schema"
              - "${var.silver_schema}"
              - "--gold_schema"
              - "${var.gold_schema}"

      queue:
        enabled: true