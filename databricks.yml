# This is a Declarative Automation Bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: 4cdc99ef-7242-493f-b6d5-3d3c7e6e2b90

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: "citibike_dev"
  bronze_schema:
    default: "01_bronze"
  silver_schema:
    default: "02_silver"
  gold_schema:
    default: "03_gold"

artifacts:
  default:
    type: whl
    build: python setup.py bdist_wheel
    path: .

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: '[testing_${workspace.current_user.short_name}] '
    workspace:
      host: https://dbc-fa36786e-332a.cloud.databricks.com
      root_path: /Workspace/Users/jm.perales.pontes@gmail.com/${bundle.name}/${bundle.target}

  test:
    mode: production
    workspace:
      host: https://dbc-fa36786e-332a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/jm.perales.pontes@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jm.perales.pontes@gmail.com/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default: "citibike_test"

    permissions:
      - user_name: jm.perales.pontes@gmail.com
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: https://dbc-fa36786e-332a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/jm.perales.pontes@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jm.perales.pontes@gmail.com/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default: "citibike_prod"

    permissions:
      - user_name: jm.perales.pontes@gmail.com
        level: CAN_MANAGE
